trigger: none

parameters:
- name: rg_name
  type: string
- name: vm_name
  type: string

pool:
  name: 'New agent'

steps:

- task: TerraformInstaller@1
  inputs:
    terraformVersion: latest


# Terraform apply
- script: |
    terraform -chdir=$(Build.SourcesDirectory)/Terraform init

    terraform -chdir=$(Build.SourcesDirectory)/Terraform apply -auto-approve \
      -var "rg_name=${{ parameters.rg_name }}" \
      -var "vm_name=${{ parameters.vm_name }}"
  displayName: Terraform Apply


# Get IP
- script: |
    terraform -chdir=$(Build.SourcesDirectory)/Terraform output -raw public_ip > ip.txt
  displayName: Get IP


# Install ansible
- script: |
    sudo apt update
    sudo apt install -y ansible
  displayName: Install Ansible


# Configure VM
- script: |
    IP=$(cat ip.txt)

    echo "[web]" > inventory.ini
    echo "$IP ansible_user=azureuser ansible_password=Password1234!" >> inventory.ini

    ansible-playbook Ansible/install-nginx.yml -i inventory.ini
  displayName: Configure VM
