trigger: none

parameters:
- name: rg_name
  type: string
- name: vm_name
  type: string

pool:
  name: 'New agent'

steps:

# ✅ Install Terraform (official Azure task)
- task: TerraformInstaller@1
  displayName: Install Terraform
  inputs:
    terraformVersion: 'latest'

# ✅ Run Terraform
- script: |
    cd terraform
    terraform init
    terraform apply -auto-approve \
      -var "rg_name=${{ parameters.rg_name }}" \
      -var "vm_name=${{ parameters.vm_name }}"
  displayName: Terraform Apply

# ✅ Get public IP
- script: |
    cd terraform
    terraform output -raw public_ip > ip.txt
  displayName: Get IP

# ✅ Install Ansible
- script: |
    sudo apt update
    sudo apt install ansible -y
  displayName: Install Ansible

# ✅ Configure VM
- script: |
    IP=$(cat terraform/ip.txt)
    echo "[web]" > inventory.ini
    echo "$IP ansible_user=azureuser ansible_password=Password1234!" >> inventory.ini
    ansible-playbook ansible/install-nginx.yml -i inventory.ini
  displayName: Configure VM
