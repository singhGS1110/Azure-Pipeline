trigger: none

parameters:
- name: rg_name
  type: string
- name: vm_name
  type: string

pool:
  vmImage: ubuntu-latest

steps:

- script: |
    curl -fsSL https://apt.releases.hashicorp.com/gpg | sudo apt-key add -
    sudo apt-get update
    sudo apt-get install terraform -y
  displayName: Install Terraform

- script: |
    cd terraform
    terraform init
    terraform apply -auto-approve \
      -var "rg_name=${{ parameters.rg_name }}" \
      -var "vm_name=${{ parameters.vm_name }}"
  displayName: Terraform Apply

- script: |
    cd terraform
    terraform output -raw public_ip > ip.txt
  displayName: Get IP

- script: |
    sudo apt update
    sudo apt install ansible -y
  displayName: Install Ansible

- script: |
    IP=$(cat terraform/ip.txt)
    echo "[web]" > inventory.ini
    echo "$IP ansible_user=azureuser ansible_password=Password1234!" >> inventory.ini
    ansible-playbook ansible/install-nginx.yml -i inventory.ini
  displayName: Configure VM
