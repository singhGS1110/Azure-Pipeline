trigger: none

parameters:
- name: rg_name
  type: string
- name: vm_name
  type: string

pool:
  name: 'New agent'   # your self-hosted agent pool

steps:

# ---------------------------------------
# Verify Terraform available
# ---------------------------------------
- script: terraform version
  displayName: Check Terraform


# ---------------------------------------
# Terraform Init + Apply
# ---------------------------------------
- script: |
    terraform -chdir=$(Build.SourcesDirectory)/Terraform init

    terraform -chdir=$(Build.SourcesDirectory)/Terraform apply -auto-approve \
      -var "rg_name=${{ parameters.rg_name }}" \
      -var "vm_name=${{ parameters.vm_name }}"
  displayName: Terraform Apply


# ---------------------------------------
# Get public IP from Terraform
# ---------------------------------------
- script: |
    terraform -chdir=$(Build.SourcesDirectory)/Terraform output -raw public_ip > ip.txt
  displayName: Get Public IP


# ---------------------------------------
# Install Ansible (only if not preinstalled)
# ---------------------------------------
- script: |
    sudo apt-get update
    sudo apt-get install -y ansible
  displayName: Install Ansible


# ---------------------------------------
# WAIT for SSH to become ready (IMPORTANT)
# ---------------------------------------
- script: |
    IP=$(cat ip.txt)

    echo "Waiting for SSH on $IP..."

    for i in {1..30}; do
      nc -z $IP 22 && echo "SSH ready!" && break
      echo "Waiting..."
      sleep 10
    done
  displayName: Wait for SSH


# ---------------------------------------
# Run Ansible playbook
# ---------------------------------------
- script: |
    IP=$(cat ip.txt)

    echo "[web]" > inventory.ini
    echo "$IP ansible_user=azureuser ansible_password=Password1234!" >> inventory.ini

    ansible-playbook $(Build.SourcesDirectory)/Ansible/install-nginx.yml -i inventory.ini
  displayName: Configure VM with Ansible
